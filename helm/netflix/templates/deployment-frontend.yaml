apiVersion: apps/v1
kind: Deployment

metadata:
  name: netflix-frontend
  namespace: dev

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: netflix-frontend

  template:
    metadata:
      labels:
        app: netflix-frontend

    spec:
      containers:

      - name: frontend

        image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: 50m
            memory: 64Mi

          limits:
            cpu: 200m
            memory: 128Mi