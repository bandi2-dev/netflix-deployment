apiVersion: apps/v1
kind: Deployment

metadata:
  name: netflix-frontend
  namespace: dev

spec:
  replicas: 1

  selector:
    matchLabels:
      app: netflix-frontend

  template:
    metadata:
      labels:
        app: netflix-frontend

    spec:
      containers:

      - name: frontend

        image: us-central1-docker.pkg.dev/godl-production/netflix-dev/netflix-frontend:1.0.0

        imagePullPolicy: Always

        ports:
        - containerPort: 3000

        resources:
          requests:
            cpu: 50m
            memory: 64Mi

          limits:
            cpu: 200m
            memory: 128Mi