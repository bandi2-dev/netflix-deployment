apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-backend
  namespace: dev
  labels:
    app: netflix-backend

spec:
  replicas: 2

  selector:
    matchLabels:
      app: netflix-backend

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: netflix-backend

    spec:
      containers:
        - name: backend

          image: us-central1-docker.pkg.dev/godl-production/netflix-dev/netflix-backend:1.0.0

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20