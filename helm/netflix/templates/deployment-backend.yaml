apiVersion: apps/v1
kind: Deployment
metadata:
  name: netflix-backend
  namespace: dev
  labels:
    app: netflix-backend

spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: netflix-backend

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: netflix-backend

    spec:
      containers:
        - name: backend

          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"

          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 200m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20