apiVersion: gateway.networking.k8s.io/v1

kind: HTTPRoute

metadata:
  name: netflix-route
  namespace: dev

spec:
  parentRefs:
    - name: netflix-gateway

  rules:

  - matches:
      - path:
          type: PathPrefix
          value: /api

    backendRefs:
      - name: netflix-backend
        port: 8080

  - matches:
      - path:
          type: PathPrefix
          value: /

    backendRefs:
      - name: netflix-frontend
        port: 3000